name: Mi puto noveno workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  test:
    name: Ejecutar tests unitarios
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependenciass
        run: npm ci

      - name: Ejecutar tests
        run: npm run test

  build-and-push:
    name: Build y push a DockerHub
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Puto login que no funciona ya 10 veces
        run: docker login -u ${{ secrets.nombre }} -p ${{ secrets.usuario }}

      - name: Extraer metadatos de imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.nombre }}/taskapp
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-,format=short

      -  name: Build y push imagen 
         run: |
            IMAGE=$(echo "${{ secrets.nombre }}/taskapp:latest" | tr '[:upper:]' '[:lower:]')
            docker build --target production -t $IMAGE .
            docker push $IMAGE
