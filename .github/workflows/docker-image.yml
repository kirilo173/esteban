name: Mi puto noveno workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: test
  # Se ejecuta en cada push y en cada pull request a main.
  # Construye el stage "test" del Dockerfile; si los tests fallan, el job falla.
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Ejecutar tests unitarios
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm run test

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: build-and-push
  # Solo se ejecuta en push a main (no en PRs).
  # Depende de que el job "test" haya pasado.
  # Construye la imagen de producción y la sube a Docker Hub.
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build y push a Docker Hub
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Habilita BuildKit y soporte multi-plataforma
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Inicia sesión en Docker Hub usando los secrets del repositorio:
      #   DOCKERHUB_USERNAME → tu usuario de Docker Hub
      #   DOCKERHUB_TOKEN   → Access Token generado en hub.docker.com
      - name: Puto login que no funciona ya 10 veces
        run: docker login -u ${{ secrets.nombre }} -p ${{ secrets.usuario }}

      # Extrae metadatos (tags, labels) automáticamente:
      #   - En main: latest + sha corto (ej. main-a1b2c3d)
      - name: Extraer metadatos de imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/taskapp
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-,format=short

      # Construye la imagen usando el target "production" del Dockerfile
      # (que incluye los stages test y build internamente) y la sube a Docker Hub
      -  name: Build y push imagen de producción
         run: |
            IMAGE=$(echo "${{ secrets.nombre }}/taskapp:latest" | tr '[:upper:]' '[:lower:]')
            docker build --target production -t $IMAGE .
            docker push $IMAGE
